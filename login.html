<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Utilería JS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="text" id="correo" placeholder="ejemplo@correo.com">
                <span class="error-msg" id="error-correo">Formato de correo no válido.</span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Tu contraseña">
                <span class="error-msg" id="error-password">La contraseña no cumple el formato requerido.</span>
            </div>

            <div class="form-group">
                <span class="error-msg" id="error-credenciales" style="text-align:center; font-size: 0.95rem;">
                    <strong>Correo o contraseña incorrectos.</strong><br> Asegúrate de haberte registrado primero.
                </span>
            </div>

            <button type="submit">Ingresar</button>
        </form>
        <p style="text-align: center; margin-top: 15px;"><a href="index.html">Ir al Registro</a></p>
    </div>

    <script src="js/utileria.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;

            document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');

            let formatoValido = true;

            if (!validarCorreo(correo)) {
                document.getElementById('error-correo').style.display = 'block';
                formatoValido = false;
            }
            if (!validarPassword(password)) {
                document.getElementById('error-password').style.display = 'block';
                formatoValido = false;
            }

            if (formatoValido) {
                const correoGuardado = localStorage.getItem('usuarioCorreo');
                const passwordGuardada = localStorage.getItem('usuarioPassword');

                if (correo === correoGuardado && password === passwordGuardada) {
                    alert(`¡Acceso concedido! Bienvenido al sistema.`);
                } else {
                    document.getElementById('error-credenciales').style.display = 'block';
                }
            }
        });
    </script>
</body>
</html>
